services:
  - type: pserv
    name: guruji-mysql
    env: image
    image:
      url: mysql:8
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: guruji_db
      - key: MYSQL_USER
        value: guruji_user
      - key: MYSQL_PASSWORD
        generateValue: true

  - type: web
    name: guruji-backend
    env: php
    rootDir: backend
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://guruji-backend.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: guruji-mysql
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: guruji-mysql
          property: port
      - key: DB_DATABASE
        value: guruji_db
      - key: DB_USERNAME
        value: guruji_user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: guruji-mysql
          envVarKey: MYSQL_PASSWORD
      - key: FRONTEND_URL
        value: https://guruji-creation.vercel.app
      - key: SANCTUM_STATEFUL_DOMAINS
        value: guruji-creation.vercel.app
      - key: SESSION_DOMAIN
        value: .render.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://guruji-creation.vercel.app
