services:
  - type: web
    name: guruji-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://guruji-backend.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: placeholder_host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: placeholder_db
      - key: DB_USERNAME
        value: placeholder_user
      - key: DB_PASSWORD
        value: placeholder_password
      - key: FRONTEND_URL
        value: https://guruji-creation.vercel.app
      - key: SANCTUM_STATEFUL_DOMAINS
        value: guruji-creation.vercel.app
      - key: SESSION_DOMAIN
        value: .render.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://guruji-creation.vercel.app
